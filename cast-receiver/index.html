<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIUsage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="receiver.css?v=12">
<!-- Cast Application Framework. On a non-Cast browser the page runs in demo mode and never starts the context. -->
<script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
</head>
<body>
<div id="stage" class="stage">
  <header class="top">
    <img src="img/aiusage.png" alt="">
    <div>
      <div class="app-name">AI Usage</div>
      <div id="sync" class="sync"></div>
    </div>
    <div id="alert" class="alert-slot"></div>
    <div class="clock">
      <div id="time" class="time">--:--</div>
      <div id="date" class="date"></div>
    </div>
  </header>
  <main id="cols" class="cols"></main>
  <div id="waiting" class="waiting">
    <img src="img/aiusage.png" alt="">
    <div class="w-title">AI Usage</div>
    <div id="waiting-text" class="w-text"></div>
  </div>
</div>
<!-- Hidden media element for the keep-alive video (receiver.js); never shown. -->
<cast-media-player id="player"></cast-media-player>
<script src="receiver.js?v=13"></script>
</body>
</html>
